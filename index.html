<!doctype html>
<html lang="en" data-style="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortex</title>
<meta name="description" content="Cortex: thinking, connected. Your notes, projects and AI sessions in one local workspace.">
<meta property="og:title" content="Cortex">
<meta property="og:description" content="Your notes, projects and AI sessions in one local workspace.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/themes.css">
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
<!-- The page around the brain follows Cortex's holding page (server.mjs scanPage). -->
<style>*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;min-height:100dvh;background:var(--bg) var(--grain-img);color:var(--text);font:var(--body-size)/1.55 var(--font-body);-webkit-text-size-adjust:100%;padding-top:var(--brain-bottom,0px)}
/* The text sits in the gap below the brain (intro.js sets --brain-bottom), a little above its middle. */
body::before{content:"";flex:4}body::after{content:"";flex:5}
.intro{position:fixed;inset:0;z-index:0;pointer-events:none}.intro canvas{position:absolute;inset:0;width:100%;height:100%}
main{position:relative;z-index:1;width:100%;max-width:34rem;margin:0 auto;padding:24px 16px max(24px,env(safe-area-inset-bottom));overflow:hidden}
main>*{animation:rise 1.4s .9s both cubic-bezier(.2,.7,.2,1)}
.mark{display:flex;align-items:center;gap:14px;font:var(--head-style) var(--head-weight) clamp(34px,6vw,48px)/1 var(--font-head);letter-spacing:-.03em}
.logo{display:grid;place-items:center;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:min(var(--radius),7px);font:600 13px var(--font-code);font-style:normal;position:relative;flex:none}
.logo::after{content:"";position:absolute;right:-5px;bottom:-5px;width:7px;height:7px;background:var(--accent);border-radius:min(var(--radius),4px)}
h1{margin:20px 0 6px;font:600 19px/1.3 var(--font-body)}p{margin:0 0 18px;color:var(--muted)}
.soon{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:var(--radius);font:600 12px var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--text)}
.soon::before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;background:var(--accent);border-radius:min(var(--radius),4px);vertical-align:1px}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}</style>
</head>
<body>
<div class="intro" id="intro" data-hold data-shift="0.16" aria-hidden="true"><canvas></canvas></div>
<main>
  <div class="mark"><span class="logo">C</span> Cortex</div>
  <h1>Thinking, connected.</h1>
  <p>Your notes, projects and AI sessions in one local workspace, so what you learn in one project carries into the next.</p>
  <span class="soon">Coming soon</span>
</main>
<!-- assets/intro.js is cortex/app/public/intro.js plus hold-mode framing in resize() (data-shift, fit to width); keep that when copying it again. -->
<script type="module" src="assets/intro.js"></script>
</body>
</html>
