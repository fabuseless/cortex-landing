<!doctype html>
<html lang="en" data-style="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortex</title>
<meta name="description" content="Cortex: thinking, connected. Your notes, projects and AI sessions in one local workspace.">
<meta property="og:title" content="Cortex">
<meta property="og:description" content="Your notes, projects and AI sessions in one local workspace.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/themes.css">
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
<style>*{box-sizing:border-box}html,body{height:100%}
body{margin:0;position:relative;min-height:100dvh;background:var(--bg) var(--grain-img);color:var(--text);font:var(--body-size)/1.55 var(--font-body);-webkit-text-size-adjust:100%}
.intro{position:fixed;inset:0;pointer-events:none}.intro canvas{position:absolute;inset:0;width:100%;height:100%}
/* From app.css's launch screen (.intro-copy, .intro-mark, .intro-enter), so this matches Cortex's home page. */
main{position:absolute;left:clamp(16px,6vw,96px);right:16px;bottom:clamp(32px,9vh,96px);max-width:34rem;animation:intro-in 1.4s .9s both cubic-bezier(.2,.7,.2,1)}
.mark{display:flex;align-items:center;gap:18px;font:var(--head-style) var(--head-weight) clamp(44px,7vw,88px)/1 var(--font-head);letter-spacing:-.035em}
.logo{display:grid;place-items:center;width:2.2em;height:2.2em;border:2px solid var(--ink);border-radius:min(var(--radius),7px);font:600 .3em var(--font-code);font-style:normal;position:relative;flex:none}
.logo::after{content:"";position:absolute;right:-5px;bottom:-5px;width:7px;height:7px;background:var(--accent);border-radius:min(var(--radius),4px)}
h1{margin:16px 0 4px;font:600 15px/1.5 var(--font-ui);color:var(--text)}p{margin:0 0 26px;font:15px/1.5 var(--font-ui);color:var(--muted)}
.soon{font:13px var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.soon::after{content:"";display:inline-block;width:6px;height:6px;margin-left:9px;background:var(--accent);border-radius:min(var(--radius),3px);vertical-align:1px}
@keyframes intro-in{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){main{animation:none}}</style>
</head>
<body>
<div class="intro" id="intro" data-hold aria-hidden="true"><canvas></canvas></div>
<main>
  <div class="mark"><span class="logo">C</span> Cortex</div>
  <h1>Thinking, connected.</h1>
  <p>Your notes, projects and AI sessions in one local workspace, so what you learn in one project carries into the next.</p>
  <span class="soon">Coming soon</span>
</main>
<!-- assets/intro.js is cortex/app/public/intro.js plus a few hold-mode lines in resize() (fit narrow screens); keep them when copying it again. -->
<script type="module" src="assets/intro.js"></script>
</body>
</html>
